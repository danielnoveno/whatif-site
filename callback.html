<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WhatIf Auto Upload — OAuth Callback</title>
  <style>
    body { font-family: Georgia, serif; max-width: 640px; margin: 60px auto;
           padding: 0 20px; line-height: 1.6; color: #1a1a1a; }
    .ok { color: #1a7f37; font-weight: bold; }
    .err { color: #c1121f; font-weight: bold; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>OAuth Callback</h1>
  <p id="msg">Memproses...</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get("code");
      var state = params.get("state");
      var err = params.get("error");
      var msg = document.getElementById("msg");
      if (err) {
        msg.innerHTML = '<span class="err">Gagal: ' + err + '</span>';
        return;
      }
      if (!code) {
        msg.innerHTML = '<span class="err">Tidak ada ?code= di URL.</span>';
        return;
      }
      msg.innerHTML = '<span class="ok">Meneruskan code ke server lokal...</span>';
      // forward to local server (top-level navigation http://localhost is allowed)
      var target = "http://127.0.0.1:8765/callback?code=" +
                   encodeURIComponent(code) +
                   (state ? "&state=" + encodeURIComponent(state) : "");
      window.location.replace(target);
    })();
  </script>
</body>
</html>
